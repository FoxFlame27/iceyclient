<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icey Client — The video</title>
  <meta name="description" content="Watch the Icey Client video: the Minecraft launcher for macOS, Windows and Linux.">
  <meta name="theme-color" content="#080c18">
  <meta property="og:title" content="Icey Client — The video">
  <meta property="og:description" content="Watch the Icey Client video.">
  <meta property="og:type" content="video.other">
  <meta property="og:url" content="https://iceymc.com/video">
  <meta property="og:image" content="https://iceymc.com/icey-client/promo-poster.jpg">
  <link rel="icon" type="image/png" href="/icey-client/favicon.png">
  <link rel="apple-touch-icon" href="/icey-client/apple-touch-icon.png">
  <link rel="preload" as="image" href="/icey-client/promo-poster.jpg">
  <link rel="preload" as="font" type="font/woff2" href="/icey-client/fonts/outfit-700.woff2" crossorigin>
  <style>
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: swap; src: url('/icey-client/fonts/inter-400.woff2') format('woff2'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 500; font-display: swap; src: url('/icey-client/fonts/inter-500.woff2') format('woff2'); }
    @font-face { font-family: 'Outfit'; font-style: normal; font-weight: 700; font-display: swap; src: url('/icey-client/fonts/outfit-700.woff2') format('woff2'); }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* Same colours and slab shapes as the download page. */
    :root {
      --ink: #080c18;
      --slab: #0e1424;
      --slab-edge: #04070f;
      --line: #27324a;
      --ice: #5bc8f5;
      --ice-edge: #1f7fab;
      --text: #e8eef6;
      --dim: #9aa8bd;
    }

    html { height: 100%; }
    body {
      min-height: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--ink);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: var(--ink) url('/icey-client/background.jpg') center/cover no-repeat;
    }
    .bg canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    .bg canvas.on { opacity: 1; }
    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(8,12,24,0.5);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 28px 20px 24px;
      text-align: center;
    }

    .logo {
      display: block;
      width: min(360px, 70vw);
      height: auto;
    }

    h1 {
      margin-top: 4px;
      font-family: 'Outfit', 'Inter', system-ui, sans-serif;
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 700;
      letter-spacing: 0.01em;
      color: #fff;
      text-shadow: 0 2px 0 rgba(4,7,15,0.7);
    }

    .film {
      width: 100%;
      margin-top: 22px;
    }
    .film video {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      border-radius: 6px;
      border: 2px solid var(--line);
      background: var(--slab-edge);
      box-shadow: 0 5px 0 var(--slab-edge);
    }
    .film-frame { position: relative; }
    /* Until it plays the poster is just a picture: say that it is a video */
    .play {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 26px 16px 22px;
      border-radius: 6px;
      border: 2px solid #a5e2fb;
      background: var(--ice);
      box-shadow: 0 5px 0 var(--ice-edge);
      color: #06121d;
      font: 700 20px 'Outfit', 'Inter', system-ui, sans-serif;
      white-space: nowrap;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease, border-color 0.12s ease;
    }
    .play[hidden] { display: none; }
    .play span { font: 500 14px 'Inter', system-ui, sans-serif; color: #0d3a52; }
    .play:hover { border-color: #fff; transform: translate(-50%, calc(-50% - 2px)); box-shadow: 0 7px 0 var(--ice-edge); }
    .play:active { transform: translate(-50%, calc(-50% + 4px)); box-shadow: 0 1px 0 var(--ice-edge); }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 22px;
      padding: 12px 20px 12px 16px;
      border-radius: 5px;
      border: 2px solid var(--line);
      background: var(--slab);
      box-shadow: 0 4px 0 var(--slab-edge);
      color: var(--text);
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      transition: transform 0.08s ease, box-shadow 0.08s ease, border-color 0.12s ease;
    }
    .back:hover { border-color: var(--ice); transform: translateY(-1px); box-shadow: 0 5px 0 var(--slab-edge); }
    .back:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--slab-edge); }

    footer {
      padding: 14px 20px 18px;
      font-size: 12px;
      line-height: 1.5;
      color: #c3cddc;
      text-shadow: 0 1px 0 rgba(4,7,15,0.8);
      text-align: center;
    }

    a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

    @media (max-width: 820px) {
      main { justify-content: flex-start; padding-top: 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .play, .back { transition: none; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><canvas id="pano"></canvas></div>

  <main>
    <a href="/"><img class="logo" src="/icey-client/logo.png" width="612" height="210" alt="Icey Client"></a>
    <h1>The video</h1>

    <section class="film">
      <div class="film-frame">
        <video id="film" controls preload="none" playsinline poster="/icey-client/promo-poster.jpg" width="1920" height="1080">
          <source src="/icey-client/icey-client-promo.mp4?v=3" type="video/mp4">
        </video>
        <button class="play" id="play" type="button" hidden>
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M6 3v18l15-9z"/></svg>
          Play video <span>3:19</span>
        </button>
      </div>
    </section>

    <a class="back" href="/">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M12 4v11"/><path d="M6 10l6 6 6-6"/><path d="M5 20h14"/></svg>
      Download Icey Client
    </a>
  </main>

  <footer>
    Not an official Minecraft product. Not approved by or associated with Mojang or Microsoft.
  </footer>

  <script src="/icey-client/pano.js?v=1"></script>
  <script>
    // A big play button over the poster; the player's own controls take over once it runs.
    (function () {
      var film = document.getElementById('film');
      var play = document.getElementById('play');
      film.controls = false;
      play.hidden = false;
      function started() { play.hidden = true; film.controls = true; }
      play.addEventListener('click', function () { started(); film.play(); });
      film.addEventListener('click', function () { if (!film.controls) { started(); film.play(); } });
      film.addEventListener('play', started);
    })();
  </script>
</body>
</html>
