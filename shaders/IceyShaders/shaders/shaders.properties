# Icey Shaders
clouds=off
oldLighting=false
separateAo=false
underwaterOverlay=false
vignette=false
sun=true
moon=true
particles.ordering=before
shadowTerrain=true
shadowTranslucent=false
shadowEntities=true
shadowBlockEntities=true

# Sun and moon keep their own pixels; the drawn sky adds them on top
blend.gbuffers_skytextured=off
# Translucent things blend their colour, never their normal or light data
blend.gbuffers_water.colortex1=off
blend.gbuffers_water.colortex2=off
blend.gbuffers_hand_water.colortex1=off
blend.gbuffers_hand_water.colortex2=off
blend.gbuffers_entities_translucent.colortex1=off
blend.gbuffers_entities_translucent.colortex2=off
blend.gbuffers_block_translucent.colortex1=off
blend.gbuffers_block_translucent.colortex2=off
blend.gbuffers_weather.colortex1=off
blend.gbuffers_weather.colortex2=off
blend.gbuffers_textured.colortex1=off
blend.gbuffers_textured.colortex2=off
blend.gbuffers_textured_lit.colortex1=off
blend.gbuffers_textured_lit.colortex2=off
blend.gbuffers_entities.colortex1=off
blend.gbuffers_entities.colortex2=off

profile.FAST=!SHADOWS CLOUD_STEPS=8 !WATER_REFLECTIONS !BLOOM
profile.BALANCED=SHADOWS CLOUD_STEPS=10 WATER_REFLECTIONS SSR_STEPS=12 BLOOM
profile.FANCY=SHADOWS CLOUD_STEPS=16 WATER_REFLECTIONS SSR_STEPS=16 BLOOM

screen=<profile> <empty> SHADOWS SHADOW_SOFTNESS CLOUDS CLOUD_STEPS CLOUD_HEIGHT <empty> WAVING WAVING_STRENGTH WATER_REFLECTIONS SSR_STEPS BLOOM BLOOM_STRENGTH SATURATION EXPOSURE
sliders=SHADOW_SOFTNESS CLOUD_STEPS CLOUD_HEIGHT WAVING_STRENGTH SSR_STEPS BLOOM_STRENGTH SATURATION EXPOSURE
